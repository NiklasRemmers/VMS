services:
  # ─── PostgreSQL Database ───
  db:
    image: postgres:16-alpine
    container_name: vms_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Flask Application (Gunicorn) ───
  app:
    # This compose file lives in ops/; build context is the repo root one level up.
    build:
      context: ..
      dockerfile: ops/Dockerfile
    container_name: vms_app
    env_file: ../.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - FLASK_ENV=production
      - GUNICORN_BIND=0.0.0.0:8000
      - GUNICORN_WORKERS=2
      - GUNICORN_ACCESS_LOG=-
      - GUNICORN_ERROR_LOG=-
      - KMS_MASTER_KEY_PATH=/etc/vms/master.key
    volumes:
      - kms_data:/etc/vms
      - app_secrets:/app/secrets_store
      - app_signatures:/app/signatures
      - app_static_signatures:/app/static/signatures
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "8000"

  # ─── Nginx Reverse Proxy ───
  nginx:
    image: nginx:alpine
    container_name: vms_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
      - ../static:/app/static:ro
      - certbot_www:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
    restart: unless-stopped
    # Reload every 6h so renewed certs are picked up (nginx only reads certs on start/reload)
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & exec nginx -g \"daemon off;\"'"
  certbot:
    image: certbot/certbot
    container_name: vms_certbot
    volumes:
      - certbot_www:/var/www/certbot
      # Same host path nginx reads from — renewals must land where nginx looks
      - /etc/letsencrypt:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done'"
volumes:
  pgdata:
  kms_data:
  app_secrets:
  app_signatures:
  app_static_signatures:
  certbot_www:
